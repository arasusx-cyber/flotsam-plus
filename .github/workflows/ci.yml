name: Tests and release package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - name: Verify source and binary manifest
        run: python3 scripts/verify_repo.py
      - name: Run resource queue checks
        run: dotnet run --project tests/SpawnBatchTests.csproj -c Release
      - name: Package checked-in plugin
        run: python3 scripts/package_release.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Flotsam-Plus-release
          path: |
            dist/Flotsam_Plus_*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag and prepare release files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/package_release.py --tag "$RELEASE_TAG"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" "dist/Flotsam_Plus_${version}.zip" dist/SHA256SUMS.txt --title "Flotsam Plus $RELEASE_TAG" --notes-file .github/RELEASE_NOTES.md --verify-tag
